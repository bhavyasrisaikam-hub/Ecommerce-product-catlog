<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Rewards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🎁 My Rewards</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="rewards.html">My Rewards</a>
    </nav>

</header>

<main>

    <section class="reward-summary">

        <div>
            <h3>Active Rewards</h3>
            <p id="activeRewards">0</p>
        </div>

        <div>
            <h3>Expiring Soon</h3>
            <p id="expiringRewards">0</p>
        </div>

        <div>
            <h3>Total Savings</h3>
            <p id="totalSavings">₹0</p>
        </div>

    </section>


    <h2 class="reward-heading">
        ⏰ Your Rewards
    </h2>

    <div id="rewardsContainer"></div>
    <section class="reward-history">
    <h2>📜 Reward History</h2>

    <div id="rewardHistoryContainer">
        <p>No rewards used yet.</p>
    </div>
</section>

</main>

<script src="rewards.js"></script>

</html>
